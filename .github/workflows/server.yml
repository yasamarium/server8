name: AS Cloud - SERVER7 (SD-Turbo 0.9B Image Generation)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [retrigger-server]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: server7-singleton
  cancel-in-progress: false

jobs:
  serve:
    name: Run SD-Turbo 0.9B
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 350

    env:
      HOST: "0.0.0.0"
      PORT: "8000"
      MODEL_ID: "stabilityai/sd-turbo"
      MODEL_NAME: "sd-turbo"
      DEFAULT_STEPS: "1"
      DEFAULT_GUIDANCE_SCALE: "0.0"
      DEFAULT_WIDTH: "512"
      DEFAULT_HEIGHT: "512"
      THREADS: "2"
      RESTART_INTERVAL_SECONDS: "18000"
      RUN_SINGLE_CYCLE: "true"
      API_KEY: ${{ secrets.API_KEY || 'qwen3-direct-access' }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install System Dependencies & Cloudflared
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl build-essential libgomp1
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: 4. Install PyTorch CPU & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 5. Cache Hugging Face Model
        id: cache-hf
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/
          key: hf-sd-turbo-v1-${{ hashFiles('scripts/download_model.py') }}
          restore-keys: |
            hf-sd-turbo-v1-

      - name: 6. Pre-Download SD-Turbo Model
        run: |
          python scripts/download_model.py

      - name: 7. Run Unit Tests
        run: |
          PYTHONPATH=. MOCK_MODEL=true python -m pytest tests/test_api.py -v

      - name: 8. Start SD-Turbo Server & Public Tunnel (~5-Hour Session)
        run: |
          chmod +x scripts/start_server.sh
          ./scripts/start_server.sh

      - name: 9. Safe Workflow Retrigger
        if: always() && steps.cache-hf.outcome != 'failure'
        run: |
          python scripts/retrigger_workflow.py

